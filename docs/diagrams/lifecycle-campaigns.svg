<text class="yes" x="584" y="381" text-anchor="middle">yes</text>
<text class="yes" x="584" y="521" text-anchor="middle">yes</text>
<rect x="48" y="170" width="230" height="100" rx="16" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="66" y="200">TRIGGER</text><text class="ttl" x="66" y="227">Opt-in</text><text class="sub" x="66" y="250">explicit marketing consent</text><rect x="339" y="170" width="230" height="100" rx="16" fill="#e1e9df" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="357" y="200">ZAPIER</text><text class="ttl" x="357" y="227">Welcome</text><text class="sub" x="357" y="250">send eligible welcome</text><rect x="48" y="310" width="230" height="100" rx="16" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="66" y="340">TRIGGER</text><text class="ttl" x="66" y="367">Cart abandoned</text><text class="sub" x="66" y="390">wait 1 hour</text><rect x="339" y="310" width="230" height="100" rx="16" fill="#f1dfd8" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="357" y="340">GUARD</text><text class="ttl" x="357" y="367">Re-check</text><text class="sub" x="357" y="390">consent, order, suppression</text><rect x="630" y="310" width="230" height="100" rx="16" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="648" y="340">NODE</text><text class="ttl" x="648" y="367">Composer API</text><text class="sub" x="648" y="390">message subject + body</text><rect x="921" y="310" width="230" height="100" rx="16" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="939" y="340">DELIVERY</text><text class="ttl" x="939" y="367">Provider send</text><text class="sub" x="939" y="390">only when still eligible</text><rect x="48" y="450" width="230" height="100" rx="16" fill="#ffffff" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="66" y="480">TRIGGER</text><text class="ttl" x="66" y="507">Dormant customer</text><text class="sub" x="66" y="530">60 days without order</text><rect x="339" y="450" width="230" height="100" rx="16" fill="#f1dfd8" stroke="#cfd8cf" stroke-width="1.5"/><text class="lbl" x="357" y="480">GUARD</text><text class="ttl" x="357" y="507">Re-check</text><text class="sub" x="357" y="530">consent, recent purchase</text>
