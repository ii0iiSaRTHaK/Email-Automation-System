.h1{font-family:Georgia,serif;font-size:34px;fill:#26332c}
.dek{font-size:16px;fill:#526259}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;fill:#44614f}
.ttl{font-size:18px;font-weight:700;fill:#26332c}
.sub{font-size:13px;fill:#526259}
.arr{fill:none;stroke:#6f7f74;stroke-width:2}
.yes{font-size:12px;font-weight:700;fill:#44614f}
