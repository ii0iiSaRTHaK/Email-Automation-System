.foot{font-size:13px;fill:#526259}
</style>
<rect width="1200" height="700" rx="24" fill="#f4f2eb"/>
<text class="eyebrow" x="48" y="57">FIELDNOTE SUPPLY  /  AUTOMATION REFERENCE</text>
<text class="h1" x="48" y="103">Lifecycle messages with eligibility checks</text>
<text class="dek" x="48" y="130">Zapier owns consent-based subscriber and recovery journeys; recheck before delayed sends.</text>

