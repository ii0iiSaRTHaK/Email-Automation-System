<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Customer email to reviewed reply</title>
<desc id="d">A Gmail support message is picked up by n8n, sent to the app endpoint, classified, drafted, flagged for review, saved as a Gmail reply draft, and sent only by a human.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0 0L12 5 0 10Z" fill="#6f7f74"/></marker></defs>
