</style>
<rect width="1200" height="700" rx="24" fill="#f4f2eb"/>
<text class="eyebrow" x="48" y="57">FIELDNOTE SUPPLY  /  AUTOMATION REFERENCE</text>
<text class="h1" x="48" y="103">Customer email to reviewed reply</text>
<text class="dek" x="48" y="130">n8n connects the mailbox; the app classifies and drafts; a person decides what leaves.</text>

